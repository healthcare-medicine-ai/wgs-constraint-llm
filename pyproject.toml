[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wgs-constraint"
version = "1.0.0"
description = "Unified meta-regression of constraint, conservation and pathogenicity for gene-disease association"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Minimum versions. requirements.txt pins the exact versions behind the published results.
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "pyBigWig>=0.3.22",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "mpl-scatter-density>=0.7",
    "tqdm>=4.65",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

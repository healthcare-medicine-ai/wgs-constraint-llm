# Paths and analysis parameters. Relative paths are relative to the repository root.
# Override the two roots with WGS_DATA_DIR and WGS_RESULTS_DIR, or point WGS_CONFIG
# at another copy of this file.

data_dir: data
results_dir: results

# Inputs, relative to data_dir. See DATA.md for sources and checksums.
inputs:
  rgc_variants: rgc_me_variant_frequencies_20231004.vcf.gz
  aou_variants: aou_variants.tsv.gz
  gnomad_exome_coverage: gnomad.exomes.v4.0.coverage.summary.tsv.bgz
  gnomad_constraint: gnomad.v4.0.constraint_metrics.tsv
  gene_annotation: gencode.v44.basic.annotation.gtf.gz
  epi25_variants: epi25_variant_results.tsv.gz
  epi25_genes_DEE: DEE_results_2023_12_30_14_36_36.csv
  epi25_genes_EPI: EPI_results_2023_12_30_14_36_32.csv
  epi25_genes_GGE: GGE_results_2023_12_30_14_36_38.csv
  epi25_genes_NAFE: NAFE_results_2023_12_30_14_36_41.csv
  alphamissense: AlphaMissense_hg38.tsv.gz
  genes4epilepsy: EpilepsyGenes_v2025-09.tsv
  gerp_bigwig: All_hg38_RS.bw
  schema_variants: SCHEMA_variant_results.tsv.bgz
  schema_genes: SCHEMA_gene_results.tsv.bgz
  liftover_chain: hg19ToHg38.over.chain.gz

# Inputs produced by an earlier stage, relative to results_dir.
derived:
  hmm_predictions: HMM_rgc_0.9_over20_chr2_predictions_rgc_wes.tsv.gz
  constraint_gerp: HMM_rgc_ALL_RS_merged_predictions.tsv.gz

# Analysis parameters behind the published results.
params:
  min_variants: 25            # per gene-group inclusion floor
  exome_wide_threshold: 3.4e-7
  suggestive_threshold: 1.0e-4
  max_allele_count: 5         # ac_case + ac_ctrl <= this
  clip_epsilon: 0.01          # probability clipping bound
  excluded_chromosomes: [chrX, chrY, chrMT]
  excluded_consequences: [synonymous, non_coding, "NA"]
  alphamissense_collapse: max # one row per variant across transcripts
